openapi: 3.0.3
info:
  title: Widget Store API
  version: "1"
  description: A deliberately small API, standing in for the one you actually work with.

servers:
  - url: http://127.0.0.1:8787

security:
  - bearerAuth: []

paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: Returns a page of widgets.
      description: >
        Widgets are returned newest first. The list is long enough that pasting it
        into a model context is exactly the mistake this example is about.
      parameters:
        - name: limit
          in: query
          description: How many widgets to return. Defaults to 50, maximum 500.
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: A page of widgets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string }
                  has_more: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Widget" }
    post:
      operationId: createWidget
      summary: Creates a widget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Human-readable name. }
                colour: { type: string, enum: [red, green, blue] }
      responses:
        "201":
          description: The widget that was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Widget" }

  /widgets/{widgetId}:
    delete:
      operationId: deleteWidget
      summary: Permanently removes one widget.
      parameters:
        - name: widgetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: The widget is gone.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Widget:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        colour: { type: string }
        createdAt: { type: string, format: date-time }

name: Bug report
description: Something behaves differently from what it documents
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials, tokens, or real response bodies.** If you
        found a way to make API Pilot leak a secret, that is a vulnerability —
        report it privately through Security → Report a vulnerability instead.
        See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came back. Redact anything sensitive.
      placeholder: |
        $ api-pilot call GET /widgets
        error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >
        The shape of your `.apipilot/environments.yaml` — keep the secret
        *references*, remove the values. Say if a spec is involved and roughly
        how large it is.
      render: yaml

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `api-pilot --version`
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: Windows 11 / Node 24.18.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - CLI
        - MCP server
        - Both
        - Used as a library
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: MCP host, if applicable
      placeholder: Claude Code, Claude Desktop, Cursor, Zed, …

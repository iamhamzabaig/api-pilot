name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      # Before the tests: the cold-start budget and the docs staleness check
      # both measure the built output, and would quietly skip without it.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:coverage

      - name: Cold start budget (NFR N1)
        run: pnpm run bench

      - name: CLI reference is current
        run: pnpm run docs:check

      - name: Smoke test the built CLI
        run: node dist/cli/index.js --version

      - name: Smoke test the MCP server
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | node dist/cli/index.js mcp \
            | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const { result } = JSON.parse(raw);
                if (result.tools.length !== 6) {
                  throw new Error(`expected 6 tools, got ${result.tools.length}`);
                }
                console.log(result.tools.map((t) => t.name).join(" "));
              });
            '

      # NFR N7: no test may reach the public internet. The suite is meant to be
      # loopback-only, and the way to know that is to take the internet away and
      # see whether it still passes. The namespace contains only this process
      # tree, so the runner's own connection to GitHub is untouched — which is
      # why this is `unshare` rather than an iptables rule.
      #
      # Last in the job: it runs as root inside the namespace and can leave
      # root-owned files in node_modules behind it.
      - name: Test with egress blocked (NFR N7)
        if: runner.os == 'Linux'
        run: |
          sudo -E env "PATH=$PATH" unshare --net --fork \
            sh -c 'ip link set lo up && exec pnpm test'

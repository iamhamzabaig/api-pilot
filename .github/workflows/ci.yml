name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      # Before the tests: the cold-start budget and the docs staleness check
      # both measure the built output, and would quietly skip without it.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:coverage

      - name: Cold start budget (NFR N1)
        run: pnpm run bench

      - name: CLI reference is current
        run: pnpm run docs:check

      - name: Smoke test the built CLI
        run: node dist/cli/index.js --version
